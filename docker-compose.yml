services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-flogo
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - ./target/sonar-flogo-plugin-1.0.0.jar:/opt/sonarqube/extensions/plugins/sonar-flogo-plugin-1.0.0.jar:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/api/system/status | grep -q UP || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s

volumes:
  sonarqube_data:
  sonarqube_logs:
